<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة البث المباشر الاحترافية</title>
    
    <!-- مكتبة المشغل الشهيرة Video.js وملفات التصميم الخاصة بها -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <!-- ثيم عالي الجودة للمشغل (City Theme) ليعطي مظهر خارق -->
    <link href="https://unpkg.com/@videojs/themes@1.0.1/dist/city/index.css" rel="stylesheet">

    <style>
        /* تصميم الخلفية والواجهة */
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 900px;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0px 4px 10px rgba(0, 0, 0, 0.5);
            background: linear-gradient(to right, #00c6ff, #0072ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0000;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 25px;
            animation: pulse 2s infinite;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: #ff0000;
            border-radius: 50%;
        }

        /* حاوية المشغل لإعطائه هيبة وتأثير مضيء */
        .video-wrapper {
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        /* تعديلات مخصصة للمشغل ليكون متجاوب 100% مع الشاشات والهواتف */
        .video-js {
            width: 100% !important;
            height: auto;
            aspect-ratio: 16 / 9;
            border-radius: 8px;
            overflow: hidden;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>قناة البث المباشر</h1>
        
        <div class="status">
            <span class="dot"></span>
            <span>مباشر الآن</span>
        </div>

        <!-- مشغل الفيديو الاحترافي -->
        <div class="video-wrapper">
            <video
                id="my-live-video"
                class="video-js vjs-theme-city vjs-big-play-centered"
                controls
                preload="auto"
                data-setup='{}'>
                <!-- رابط البث المباشر الخاص بك -->
                <source src="http://37.48.82.95/live/HUSSEIN5050/Hussein6060/214574.m3u8?token=Y2YzWXpGMGdDaWVmN0VCE" type="application/x-mpegURL">
                <p class="vjs-no-js">
                    المتصفح الخاص بك لا يدعم تشغيل هذا الفيديو، يرجى تحديث المتصفح.
                </p>
            </video>
        </div>

        <footer>جميع الحقوق محفوظة © 2026</footer>
    </div>

    <!-- جافا سكريبت الخاصة بالمشغل لتثبيت البث ومنع التقطيع -->
    <script src="https://vjs.zencdn.net/8.10.0/video.js"></script>
</body>
</html>
