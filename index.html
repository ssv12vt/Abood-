<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل البث المباشر</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .player-section {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        #video-container {
            background: #000;
            width: 100%;
            padding-bottom: 56.25%;
            position: relative;
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .channel-info {
            padding: 20px;
            background: #f8f9fa;
            text-align: center;
        }

        .channel-info h2 {
            color: #2a5298;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 مشغل البث المباشر</h1>
        </header>

        <div class="player-section">
            <div id="video-container">
                <video id="video-player" controls autoplay crossorigin="anonymous"></video>
            </div>
            
            <div class="channel-info">
                <h2>🔴 البث المباشر</h2>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        const videoPlayer = document.getElementById('video-player');
        const streamUrl = 'http://37.48.82.95/live/HUSSEIN5050/Hussein6060/214574.m3u8?token=Y2YzWXpGMGdDaWVmN0VC';

        if (Hls.isSupported()) {
            const hls = new Hls({
                debug: false,
                enableWorker: true
            });
            hls.loadSource(streamUrl);
            hls.attachMedia(videoPlayer);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                videoPlayer.play();
            });
        } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
            videoPlayer.src = streamUrl;
            videoPlayer.play();
        }
    </script>
</body>
</html>
